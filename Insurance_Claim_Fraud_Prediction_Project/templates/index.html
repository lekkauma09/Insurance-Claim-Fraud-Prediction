<!doctype html><html><head><title>ClaimGuard AI</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>ClaimGuard AI</b><a href="/dashboard">Dashboard</a></nav><main><section class="hero"><div><span class="pill">AI INSURANCE CLAIM ANALYTICS</span><h1>Insurance Claim<br><em>Fraud Prediction</em></h1><p>Enter claim details to estimate the probability that a claim may require further fraud review.</p></div><div class="card score"><div>Models</div><strong>2</strong><small>Logistic Regression + Random Forest</small></div></section>
<section class="card"><h2>Claim Entry Form</h2><form method="post" action="/predict" class="grid"><label>Claim Name<input name="claim_name" placeholder="e.g. CLM-1001"></label><label>Age<input name="Age" type="number" value="35" min="16" max="100"></label><label>Sex<select name="Sex"><option>Male</option><option>Female</option></select></label><label>Marital Status<select name="MaritalStatus"><option>Married</option><option>Single</option><option>Widow</option><option>Divorced</option></select></label><label>Accident Area<select name="AccidentArea"><option>Urban</option><option>Rural</option></select></label><label>Fault<select name="Fault"><option>Policy Holder</option><option>Third Party</option></select></label><label>Policy Type<select name="PolicyType"><option>Sedan - Collision</option><option>Sedan - Liability</option><option>Sedan - All Perils</option><option>Sport - Collision</option><option>Sport - Liability</option><option>Utility - All Perils</option></select></label><label>Vehicle Category<select name="VehicleCategory"><option>Sedan</option><option>Sport</option><option>Utility</option></select></label><label>Vehicle Price<select name="VehiclePrice"><option>less than 20000</option><option>20000 to 29000</option><option>30000 to 39000</option><option>40000 to 59000</option><option>60000 to 69000</option><option>more than 69000</option></select></label><label>Driver Rating<select name="DriverRating"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Police Report Filed<select name="PoliceReportFiled"><option>No</option><option>Yes</option></select></label><label>Witness Present<select name="WitnessPresent"><option>No</option><option>Yes</option></select></label><label>Agent Type<select name="AgentType"><option>External</option><option>Internal</option></select></label><label>Past Claims<select name="PastNumberOfClaims"><option>none</option><option>1</option><option>2 to 4</option><option>more than 4</option></select></label><label>Supplements<select name="NumberOfSuppliments"><option>none</option><option>1 to 2</option><option>3 to 5</option><option>more than 5</option></select></label><label>Age of Vehicle<select name="AgeOfVehicle"><option>new</option><option>2 years</option><option>3 years</option><option>4 years</option><option>5 years</option><option>6 years</option><option>7 years</option><option>more than 7</option></select></label><label>Base Policy<select name="BasePolicy"><option>Liability</option><option>Collision</option><option>All Perils</option></select></label><label>Deductible<select name="Deductible"><option>300</option><option>400</option><option>500</option><option>700</option></select></label><div class="full"><button>Predict Claim Risk →</button></div></form></section></main></body></html>
